<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airport Times Board</title>
<style>
  :root {
    --bg: #000000;
    --card: #000000;
    --accent: #A8E040;
    --text: #A8E040;
    --muted: #A8E040;
    --border: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
  }
  header {
    background: #000000;
    border-bottom: 1px solid #1a1a1a;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    opacity: 0;
    transform: translateY(-100%);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  header:hover,
  header.visible {
    opacity: 1;
    transform: translateY(0);
  }
  header h1 {
    font-size: 1rem;
    letter-spacing: 0.5px;
    color: var(--accent);
  }
  header .controls {
    display: flex;
    gap: 6px;
  }
  button {
    background: #000000;
    color: var(--accent);
    border: 1px solid #333;
    padding: 4px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 0.7rem;
  }
  button:hover { background: #111; }
  #board-container {
    height: 100vh;
    overflow: hidden;
    position: relative;
  }
  #board-container.reorder-mode {
    overflow-y: auto;
  }
  #board-container.reorder-mode #board {
    transform: none !important;
  }
  .airport-card.reorderable {
    cursor: grab;
    border-color: #A8E040;
  }
  .airport-card.reorderable:active {
    cursor: grabbing;
  }
  #board {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
  }
  .airport-card {
    background: #000000;
    border: 1px solid #222;
    border-radius: 8px;
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px 12px;
    cursor: grab;
    user-select: none;
    align-items: center;
  }
  .airport-card:active { cursor: grabbing; }
  .airport-card.dragging { opacity: 0.5; }
  .left-col {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .code-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .code {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .name {
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 500;
  }
  .meta {
    font-size: 0.68rem;
    color: var(--accent);
    line-height: 1.3;
  }
  .right-col {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .time-big {
    font-size: 2.1rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
    letter-spacing: 0.5px;
    line-height: 1;
  }
  .daynight-block {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent);
    transition: all 0.3s ease;
  }
  .daynight-block.changing {
    animation: dayNightChange 10s ease-in-out;
  }
  @keyframes dayNightChange {
    0% { transform: scale(1); filter: brightness(1); }
    10% { transform: scale(0.6); opacity: 0.3; }
    20% { transform: scale(1.4); opacity: 1; filter: brightness(2.5) drop-shadow(0 0 12px #A8E040); }
    35% { transform: scale(1.1); filter: brightness(1.8); }
    50% { transform: scale(1.25); filter: brightness(2.2) drop-shadow(0 0 8px #A8E040); }
    70% { transform: scale(1); filter: brightness(1.4); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  .utc-near {
    font-size: 0.7rem;
    color: var(--accent);
    text-align: right;
    margin-top: 2px;
  }
</style>
</head>
<body>
<header>
  <h1>✈ AIRPORT TIMES</h1>
  <div class="controls">
    <button id="reorder">Re-order</button>
    <button id="toggle-scroll">Pause Scroll</button>
    <button id="reset-order">Reset Order</button>
  </div>
</header>
<div id="board-container">
  <div id="board"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<script>
const airports = [
  { code: 'DRW', name: 'Darwin', tz: 'Australia/Darwin', lat: -12.408, lng: 130.877 },
  { code: 'CNS', name: 'Cairns', tz: 'Australia/Brisbane', lat: -16.886, lng: 145.755 },
  { code: 'BNE', name: 'Brisbane', tz: 'Australia/Brisbane', lat: -27.384, lng: 153.117 },
  { code: 'SYD', name: 'Sydney', tz: 'Australia/Sydney', lat: -33.946, lng: 151.177 },
  { code: 'MEL', name: 'Melbourne', tz: 'Australia/Melbourne', lat: -37.673, lng: 144.843 },
  { code: 'ADL', name: 'Adelaide', tz: 'Australia/Adelaide', lat: -34.945, lng: 138.531 },
  { code: 'PER', name: 'Perth', tz: 'Australia/Perth', lat: -31.940, lng: 115.967 },
  { code: 'AKL', name: 'Auckland', tz: 'Pacific/Auckland', lat: -37.008, lng: 174.792 },
  { code: 'NLK', name: 'Norfolk Island', tz: 'Pacific/Norfolk', lat: -29.042, lng: 167.939 },
  { code: 'BAH', name: 'Bahrain', tz: 'Asia/Bahrain', lat: 26.270, lng: 50.634 },
  { code: 'UTC', name: 'UTC', tz: 'UTC', lat: 0, lng: 0 }
];

const names = ['Tyson', 'Liam', 'Mel', 'Chris', 'Carro', 'Rachel', 'Rudy'];
let nameIndex = 0;
let heyActive = false;
let lastHeyMinute = -1;

let order = JSON.parse(localStorage.getItem('airportOrder')) || airports.map((_, i) => i);
let dragging = null;

function saveOrder() {
  localStorage.setItem('airportOrder', JSON.stringify(order));
}

function getHeyCard() {
  const now = new Date();
  const brisTime = new Intl.DateTimeFormat('en-AU', {
    timeZone: 'Australia/Brisbane',
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  });
  const parts = brisTime.formatToParts(now);
  const brisHour = parseInt(parts.find(p => p.type === 'hour').value, 10);
  const brisMin = parseInt(parts.find(p => p.type === 'minute').value, 10);

  if (brisHour === 18 && brisMin === 0) {
    return `
      <div class="airport-card hey-card" style="justify-content:center; text-align:center; background:#111; padding:16px;">
        <div style="font-size:1.4rem; font-weight:700; color:var(--accent); line-height:1.3;">
          Good evening, you beautiful and sexy legends. You've got this!
        </div>
      </div>
    `;
  }

  const name = names[nameIndex % names.length];
  let message = `Hey ${name}!`;

  if (name === 'Chris') {
    message = "Hey Chris, you look amazing as always. You look ok too Mel.";
  } else if (name === 'Mel') {
    message = "Hey Mel, you look wonderful as always!";
  } else if (name === 'Liam') {
    message = "Hey Liam, you look incredible with those massive arms 💪💪";
  }

  return `
    <div class="airport-card hey-card" style="justify-content:center; text-align:center; background:#111; padding:16px;">
      <div style="font-size:1.4rem; font-weight:700; color:var(--accent); line-height:1.3;">${message}</div>
    </div>
  `;
}

function isWithinHeyHours(now) {
  const brisFormatter = new Intl.DateTimeFormat('en-AU', {
    timeZone: 'Australia/Brisbane',
    weekday: 'short',
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  });
  const parts = brisFormatter.formatToParts(now);
  const dayMap = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 0 };
  const dayName = parts.find(p => p.type === 'weekday').value;
  const day = dayMap[dayName];
  const hours = parseInt(parts.find(p => p.type === 'hour').value, 10);
  const minutes = parseInt(parts.find(p => p.type === 'minute').value, 10);

  if (day < 1 || day > 4) return false;

  const totalMinutes = hours * 60 + minutes;
  if (totalMinutes >= 18 * 60 || totalMinutes <= 4 * 60 + 30) return true;
  return false;
}

function checkHeyTime() {
  const now = new Date();
  if (!isWithinHeyHours(now)) return;

  const min = now.getMinutes();
  const sec = now.getSeconds();

  if ((min === 0 || min === 30) && sec < 5 && lastHeyMinute !== min) {
    lastHeyMinute = min;
    heyActive = true;
    const brisHour = parseInt(new Intl.DateTimeFormat('en-AU', {
      timeZone: 'Australia/Brisbane', hour: '2-digit', hour12: false
    }).format(now), 10);
    if (!(brisHour === 18 && min === 0)) {
      nameIndex++;
    }
    setTimeout(() => { heyActive = false; render(true); }, 35000);
  }
}

let lastReloadDay = null;

function checkDailyReload() {
  const now = new Date();
  const bris = new Intl.DateTimeFormat('en-AU', {
    timeZone: 'Australia/Brisbane',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  }).formatToParts(now);

  const dayKey = bris.find(p => p.type === 'year').value + '-' +
                 bris.find(p => p.type === 'month').value + '-' +
                 bris.find(p => p.type === 'day').value;
  const hours = parseInt(bris.find(p => p.type === 'hour').value, 10);
  const minutes = parseInt(bris.find(p => p.type === 'minute').value, 10);

  if (hours === 7 && minutes >= 30 && lastReloadDay !== dayKey) {
    lastReloadDay = dayKey;
    location.reload(true);
  }
}

function getOffset(tz, date = new Date()) {
  try {
    const formatter = new Intl.DateTimeFormat('en', {
      timeZone: tz,
      timeZoneName: 'shortOffset'
    });
    const parts = formatter.formatToParts(date);
    const offsetPart = parts.find(p => p.type === 'timeZoneName');
    if (offsetPart) {
      let off = offsetPart.value;
      if (off.startsWith('GMT')) off = off.replace('GMT', 'UTC');
      return off;
    }
  } catch (e) {}
  return 'UTC';
}

function formatTime(date, tz) {
  return new Intl.DateTimeFormat('en-AU', {
    timeZone: tz,
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  }).format(date);
}

function formatDate(date, tz) {
  return new Intl.DateTimeFormat('en-AU', {
    timeZone: tz,
    weekday: 'short',
    day: '2-digit',
    month: 'short',
    year: 'numeric'
  }).format(date);
}

function getSunTimes(lat, lng, date, tz) {
  if (lat === 0 && lng === 0) return { sunrise: '--:--', sunset: '--:--', isDay: true };
  const times = SunCalc.getTimes(date, lat, lng);
  const sunrise = formatTime(times.sunrise, tz);
  const sunset = formatTime(times.sunset, tz);
  const now = new Date();
  const isDay = now >= times.sunrise && now <= times.sunset;
  return { sunrise, sunset, isDay };
}

let lastOrderKey = '';
let lastHeyActive = false;
let lastDayNightState = {};

function updateTimesOnly() {
  const now = new Date();
  const utcTime = formatTime(now, 'UTC');
  const cards = document.querySelectorAll('.airport-card:not(.hey-card)');

  cards.forEach(card => {
    const idx = parseInt(card.dataset.idx, 10);
    if (isNaN(idx)) return;
    const a = airports[idx];
    const localTime = formatTime(now, a.tz);
    const localDate = formatDate(now, a.tz);
    const offset = getOffset(a.tz, now);
    const sun = getSunTimes(a.lat, a.lng, now, a.tz);
    const dayLabel = sun.isDay ? 'DAY' : 'NIGHT';
    const dayNight = sun.isDay ? '☀️' : '🌙';
    const stateKey = a.code;

    const dayNightBlock = card.querySelector('.daynight-block');
    if (dayNightBlock && lastDayNightState[stateKey] !== undefined && lastDayNightState[stateKey] !== sun.isDay) {
      dayNightBlock.classList.add('changing');
      setTimeout(() => dayNightBlock.classList.remove('changing'), 10000);
    }
    lastDayNightState[stateKey] = sun.isDay;

    const timeEl = card.querySelector('.time-big');
    const dateEl = card.querySelector('.meta:nth-of-type(1)');
    const sunEl = card.querySelector('.meta:nth-of-type(2)');
    const offsetEl = card.querySelector('.meta:nth-of-type(3)');
    const dayNightEl = card.querySelector('.daynight-block span:first-child');
    const dayLabelEl = card.querySelector('.daynight-block span:last-child');
    const utcEl = card.querySelector('.utc-near');

    if (timeEl) timeEl.textContent = localTime;
    if (dateEl) dateEl.textContent = localDate;
    if (sunEl) sunEl.innerHTML = `↑ ${sun.sunrise} &nbsp; ↓ ${sun.sunset}`;
    if (offsetEl) offsetEl.textContent = offset;
    if (dayNightEl) dayNightEl.textContent = dayNight;
    if (dayLabelEl) dayLabelEl.textContent = dayLabel;
    if (utcEl) utcEl.textContent = `UTC ${utcTime}`;
  });
}

function render(force = false) {
  const board = document.getElementById('board');
  const orderKey = order.join(',');
  const isReordering = document.getElementById('board-container').classList.contains('reorder-mode');
  const needsFullRebuild = force || orderKey !== lastOrderKey || heyActive !== lastHeyActive || isReordering;

  if (!needsFullRebuild) {
    updateTimesOnly();
    return;
  }

  lastOrderKey = orderKey;
  lastHeyActive = heyActive;

  const now = new Date();
  const utcTime = formatTime(now, 'UTC');

  function cardHTML(idx, isDuplicate = false) {
    const a = airports[idx];
    const localTime = formatTime(now, a.tz);
    const localDate = formatDate(now, a.tz);
    const offset = getOffset(a.tz, now);
    const sun = getSunTimes(a.lat, a.lng, now, a.tz);
    const dayLabel = sun.isDay ? 'DAY' : 'NIGHT';
    const dayNight = sun.isDay ? '☀️' : '🌙';
    const dupAttr = isDuplicate ? ' data-duplicate="true"' : ' draggable="true"';

    return `
      <div class="airport-card" data-idx="${idx}"${dupAttr}>
        <div class="left-col">
          <div class="code-row">
            <div class="code">${a.code}</div>
            <div class="name">${a.name}</div>
          </div>
          <div class="meta">${localDate}</div>
          <div class="meta">↑ ${sun.sunrise} &nbsp; ↓ ${sun.sunset}</div>
          <div class="meta">${offset}</div>
        </div>
        <div class="right-col">
          <div class="time-big">${localTime}</div>
          <div class="daynight-block">
            <span>${dayNight}</span>
            <span>${dayLabel}</span>
          </div>
          <div class="utc-near">UTC ${utcTime}</div>
        </div>
      </div>
    `;
  }

  let html = order.map(idx => cardHTML(idx)).join('');
  if (heyActive && !isReordering) html += getHeyCard();
  if (!isReordering) {
    html += order.map(idx => cardHTML(idx, true)).join('');
  }
  board.innerHTML = html;

  setupDrag();

  if (isReordering) {
    document.querySelectorAll('.airport-card:not([data-duplicate])').forEach(card => {
      card.classList.add('reorderable');
    });
  }
}

function setupDrag() {
  const cards = document.querySelectorAll('.airport-card:not([data-duplicate])');
  cards.forEach(card => {
    card.addEventListener('dragstart', e => {
      if (!document.getElementById('board-container').classList.contains('reorder-mode')) {
        e.preventDefault();
        return;
      }
      dragging = card;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', card.dataset.idx);
    });

    card.addEventListener('dragover', e => {
      e.preventDefault();
      if (!dragging || dragging === card) return;
      const rect = card.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      if (e.clientY < mid) {
        card.parentNode.insertBefore(dragging, card);
      } else {
        card.parentNode.insertBefore(dragging, card.nextSibling);
      }
    });

    card.addEventListener('dragend', () => {
      if (dragging) dragging.classList.remove('dragging');
      dragging = null;
      const newOrder = [...document.querySelectorAll('#board > .airport-card:not([data-duplicate])')]
        .map(c => parseInt(c.dataset.idx, 10))
        .filter(n => !isNaN(n));
      if (newOrder.length === order.length) {
        order = newOrder;
        saveOrder();
      }
    });
  });
}

document.getElementById('reorder').onclick = () => {
  const container = document.getElementById('board-container');
  const btn = document.getElementById('reorder');
  const isReordering = container.classList.toggle('reorder-mode');
  scrolling = !isReordering;
  btn.textContent = isReordering ? 'Done' : 'Re-order';
  document.getElementById('toggle-scroll').textContent = scrolling ? 'Pause Scroll' : 'Resume Scroll';

  if (isReordering) {
    document.getElementById('board').style.transform = 'none';
  }
  render(true);
};

document.getElementById('reset-order').onclick = () => {
  order = airports.map((_, i) => i);
  saveOrder();
  render(true);
};

let scrolling = true;
let scrollPos = 0;
let scrollSpeed = 0.4;

function startContinuousScroll() {
  const container = document.getElementById('board-container');
  const board = document.getElementById('board');

  function animate() {
    if (scrolling && !document.getElementById('board-container').classList.contains('reorder-mode') && board.scrollHeight > container.clientHeight) {
      scrollPos += scrollSpeed;
      const halfHeight = board.scrollHeight / 2;
      if (scrollPos >= halfHeight) {
        scrollPos = 0;
      }
      board.style.transform = `translateY(-${scrollPos}px)`;
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
}

document.getElementById('toggle-scroll').onclick = () => {
  scrolling = !scrolling;
  document.getElementById('toggle-scroll').textContent = scrolling ? 'Pause Scroll' : 'Resume Scroll';
};

let scrollStarted = false;

function checkOverflow() {
  const container = document.getElementById('board-container');
  const board = document.getElementById('board');
  if (board.scrollHeight > container.clientHeight && !scrollStarted) {
    scrollStarted = true;
    startContinuousScroll();
  }
}

setInterval(() => {
  updateTimesOnly();
}, 1000);

setInterval(() => {
  render(true);
}, 60 * 60 * 1000);

setInterval(checkHeyTime, 1000);
setInterval(checkDailyReload, 30000);

document.addEventListener('mousemove', (e) => {
  const header = document.querySelector('header');
  if (e.clientY < 60) {
    header.classList.add('visible');
  } else {
    header.classList.remove('visible');
  }
});

render(true);
setTimeout(checkOverflow, 500);
</script>
</body>
</html>
