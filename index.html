<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airport Times Board</title>
<style>
  :root {
    --bg: #0a0e17;
    --card: #121826;
    --accent: #00d4ff;
    --text: #e8eef5;
    --muted: #8b9bb4;
    --day: #ffd166;
    --night: #6c5ce7;
    --border: #1e293b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
  }
  header {
    background: #0d1320;
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 1rem;
    letter-spacing: 0.5px;
    color: var(--accent);
  }
  header .controls {
    display: flex;
    gap: 6px;
  }
  button {
    background: #1a2332;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 0.7rem;
  }
  button:hover { background: #243044; }
  #board-container {
    height: calc(100vh - 44px);
    overflow: hidden;
    position: relative;
  }
  #board {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
  }
  .airport-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    cursor: grab;
    user-select: none;
  }
  .airport-card:active { cursor: grabbing; }
  .airport-card.dragging { opacity: 0.5; }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .code {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent);
  }
  .name {
    font-size: 0.7rem;
    color: var(--muted);
  }
  .daynight {
    font-size: 1.1rem;
  }
  .offset {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent);
  }
  .time-big {
    font-size: 1.6rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }
  .time-small {
    font-size: 0.72rem;
    color: var(--muted);
  }
  .sun-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--muted);
  }
  .utc-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 2px;
    margin-top: 2px;
  }
  .scrolling #board {
    animation: scroll 40s linear infinite;
  }
  @keyframes scroll {
    0% { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }
  .pause-scroll { animation-play-state: paused !important; }
</style>
</head>
<body>
<header>
  <h1>✈ AIRPORT TIMES</h1>
  <div class="controls">
    <button id="shuffle">Shuffle</button>
    <button id="toggle-scroll">Pause Scroll</button>
    <button id="reset-order">Reset Order</button>
  </div>
</header>
<div id="board-container">
  <div id="board"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<script>
const airports = [
  { code: 'DRW', name: 'Darwin', tz: 'Australia/Darwin', lat: -12.408, lng: 130.877 },
  { code: 'CNS', name: 'Cairns', tz: 'Australia/Brisbane', lat: -16.886, lng: 145.755 },
  { code: 'BNE', name: 'Brisbane', tz: 'Australia/Brisbane', lat: -27.384, lng: 153.117 },
  { code: 'SYD', name: 'Sydney', tz: 'Australia/Sydney', lat: -33.946, lng: 151.177 },
  { code: 'MEL', name: 'Melbourne', tz: 'Australia/Melbourne', lat: -37.673, lng: 144.843 },
  { code: 'ADL', name: 'Adelaide', tz: 'Australia/Adelaide', lat: -34.945, lng: 138.531 },
  { code: 'PER', name: 'Perth', tz: 'Australia/Perth', lat: -31.940, lng: 115.967 },
  { code: 'AKL', name: 'Auckland', tz: 'Pacific/Auckland', lat: -37.008, lng: 174.792 },
  { code: 'NLK', name: 'Norfolk Island', tz: 'Pacific/Norfolk', lat: -29.042, lng: 167.939 },
  { code: 'BAH', name: 'Bahrain', tz: 'Asia/Bahrain', lat: 26.270, lng: 50.634 },
  { code: 'UTC', name: 'UTC', tz: 'UTC', lat: 0, lng: 0 }
];

let order = airports.map((_, i) => i);
let dragging = null;

function getOffset(tz, date = new Date()) {
  try {
    const formatter = new Intl.DateTimeFormat('en', {
      timeZone: tz,
      timeZoneName: 'shortOffset'
    });
    const parts = formatter.formatToParts(date);
    const offsetPart = parts.find(p => p.type === 'timeZoneName');
    if (offsetPart) {
      let off = offsetPart.value;
      if (off.startsWith('GMT')) off = off.replace('GMT', 'UTC');
      return off;
    }
  } catch (e) {}
  return 'UTC';
}

function formatTime(date, tz) {
  return new Intl.DateTimeFormat('en-AU', {
    timeZone: tz,
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  }).format(date);
}

function formatDate(date, tz) {
  return new Intl.DateTimeFormat('en-AU', {
    timeZone: tz,
    weekday: 'short',
    day: '2-digit',
    month: 'short',
    year: 'numeric'
  }).format(date);
}

function getSunTimes(lat, lng, date, tz) {
  if (lat === 0 && lng === 0) return { sunrise: '--:--', sunset: '--:--', isDay: true };
  const times = SunCalc.getTimes(date, lat, lng);
  const sunrise = formatTime(times.sunrise, tz);
  const sunset = formatTime(times.sunset, tz);
  const now = new Date();
  const isDay = now >= times.sunrise && now <= times.sunset;
  return { sunrise, sunset, isDay };
}

function render() {
  const board = document.getElementById('board');
  const now = new Date();
  const utcTime = formatTime(now, 'UTC');
  const utcDate = formatDate(now, 'UTC');

  function cardHTML(idx, isDuplicate = false) {
    const a = airports[idx];
    const localTime = formatTime(now, a.tz);
    const localDate = formatDate(now, a.tz);
    const offset = getOffset(a.tz, now);
    const sun = getSunTimes(a.lat, a.lng, now, a.tz);
    const dayNight = sun.isDay ? '☀️' : '🌙';
    const dupAttr = isDuplicate ? ' data-duplicate="true"' : ' draggable="true"';

    return `
      <div class="airport-card" data-idx="${idx}"${dupAttr}>
        <div class="top-row">
          <div>
            <div class="code">${a.code}</div>
            <div class="name">${a.name}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="daynight">${dayNight}</span>
            <span class="offset">${offset}</span>
          </div>
        </div>
        <div class="time-big">${localTime}</div>
        <div class="time-small">${localDate}</div>
        <div class="sun-row">
          <span>↑ ${sun.sunrise}</span>
          <span>↓ ${sun.sunset}</span>
        </div>
        <div class="utc-row">
          <span>UTC ${utcTime}</span>
          <span>${utcDate}</span>
        </div>
      </div>
    `;
  }

  board.innerHTML = order.map(idx => cardHTML(idx)).join('') + order.map(idx => cardHTML(idx, true)).join('');

  setupDrag();
}

function setupDrag() {
  const cards = document.querySelectorAll('.airport-card:not([data-duplicate])');
  cards.forEach(card => {
    card.addEventListener('dragstart', e => {
      dragging = card;
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.dataset.idx);
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      const newOrder = [...document.querySelectorAll('#board > .airport-card:not([data-duplicate])')]
        .map(c => parseInt(c.dataset.idx));
      if (newOrder.length === order.length) {
        order = newOrder;
      }
      render();
    });
    card.addEventListener('dragover', e => e.preventDefault());
  });
}

document.getElementById('shuffle').onclick = () => {
  order = [...order].sort(() => Math.random() - 0.5);
  render();
};

document.getElementById('reset-order').onclick = () => {
  order = airports.map((_, i) => i);
  render();
};

let scrolling = true;
document.getElementById('toggle-scroll').onclick = () => {
  const container = document.getElementById('board-container');
  scrolling = !scrolling;
  container.classList.toggle('scrolling', scrolling);
  document.getElementById('toggle-scroll').textContent = scrolling ? 'Pause Scroll' : 'Resume Scroll';
};

function checkOverflow() {
  const container = document.getElementById('board-container');
  const board = document.getElementById('board');
  if (board.scrollHeight > container.clientHeight * 1.5) {
    container.classList.add('scrolling');
  }
}

setInterval(render, 1000);
render();
setTimeout(checkOverflow, 500);
</script>
</body>
</html>
